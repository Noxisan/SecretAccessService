name: CI

# Continuous integration: every push to the long-lived branches and every PR
# runs the same gates we run locally before a merge (lint, strict types, tests,
# build). Keeps develop green so releases can be cut at any time.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check (strict)
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
